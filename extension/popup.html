<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SI-JUANG Operator</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <img class="logo" src="assets/icon-128.png" alt="" />
      <div>
        <h1>SI-JUANG</h1>
        <p>Portal Operator Gampong</p>
      </div>
    </header>

    <main>
      <form id="loginForm" class="panel" novalidate>
        <h2>Masuk operator</h2>
        <p class="hint">Gunakan akun operator yang diberikan oleh admin kecamatan.</p>
        <label for="email">Email operator</label>
        <input id="email" type="email" autocomplete="username" required />
        <label for="password">Kata sandi</label>
        <input id="password" type="password" autocomplete="current-password" required />
        <button id="loginButton" type="submit">Masuk</button>
      </form>

      <form id="submissionForm" class="panel hidden" novalidate>
        <div class="account-row">
          <div>
            <h2>Pengajuan berkas</h2>
            <p id="operatorIdentity" class="hint"></p>
          </div>
          <button id="logoutButton" class="text-button" type="button">Keluar</button>
        </div>

        <label for="jenisSurat">Jenis surat</label>
        <select id="jenisSurat" required></select>

        <label for="namaPemohon">Nama pemohon</label>
        <input id="namaPemohon" type="text" maxlength="120" autocomplete="name" required />

        <label for="keterangan">Keterangan <span class="optional">(opsional)</span></label>
        <textarea id="keterangan" rows="3" maxlength="1000"></textarea>

        <label for="driveUrl">Tautan berkas Google Drive</label>
        <input
          id="driveUrl"
          type="url"
          placeholder="https://drive.google.com/..."
          autocomplete="url"
          required
        />
        <p class="hint">Atur akses tautan agar admin kecamatan dapat membuka atau mengunduh berkas.</p>

        <button id="submitButton" type="submit">Kirim pengajuan</button>
      </form>

      <div id="message" class="message hidden" role="status" aria-live="polite"></div>
      <p class="footer-note">Berkas tetap berada di Google Drive Anda. Ekstensi hanya mengirim tautan dan data pengajuan.</p>
    </main>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
