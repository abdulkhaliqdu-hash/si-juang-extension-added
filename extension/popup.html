<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SI-JUANG</title>
    <style>
      body { width: 360px; margin: 0; font-family: Arial, sans-serif; background: #f8fafc; color: #1e293b; }
      .wrap { padding: 18px; }
      h2 { margin: 0 0 14px; font-size: 20px; }
      label { display:block; margin:10px 0 6px; font-weight:700; font-size: 12px; }
      input, button { width: 100%; box-sizing: border-box; border-radius: 10px; padding: 10px 12px; }
      input { border: 1px solid #dbe3ef; }
      button { margin-top: 12px; background: linear-gradient(135deg, #0f766e, #14b8a6); color: white; border:0; font-weight:700; cursor:pointer; }
      .small { font-size: 12px; color: #64748b; }
      .msg { margin-top: 12px; min-height: 20px; font-size: 12px; }
      .error { color: #b91c1c; }
      .success { color: #047857; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h2>SI-JUANG</h2>
      <form id="loginForm">
        <label>Email</label>
        <input id="email" type="email" placeholder="operator@email.com" required />
        <label>Password</label>
        <input id="password" type="password" placeholder="********" required />
        <button type="submit">Masuk</button>
      </form>

      <div id="msg" class="msg"></div>
      <div class="small" style="margin-top: 14px;">Backend belum disiapkan. Login dan pengiriman dokumen baru dapat digunakan setelah integrasi Supabase.</div>
    </div>

    <script src="config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
